/* ---- Staff ---- */
function Staff({d}){const [m,setM]=useState(false),[ed,setEd]=useState(null);
 async function mk(e){const f=frm(e);const a2=firebase.apps.find(x=>x.name=="s")||firebase.initializeApp(FB,"s");const cr=await a2.auth().createUserWithEmailAndPassword(f.email,f.password);await a2.auth().signOut();
  await db.collection("users").doc(cr.user.uid).set({name:f.name,email:f.email,role:f.role,active:true,ts:Date.now()});log("Staff created",`${f.name} (${f.role})`);setM(false)}
 const up=async(u,o,l)=>run(async()=>{await db.collection("users").doc(u.id).update(o);log(l,u.name)});
 const pin=async()=>{const p=prompt("New 4+ digit Super Admin PIN:");if(p&&p.length>=4){await db.collection("users").doc(ME.id).update({pinHash:await sha(p)});log("PIN changed")}};
 return h`<div class="card"><div class="row"><button class="p" onClick=${()=>setM(true)}>+ Create staff</button><button class="s" onClick=${pin}>Change my PIN</button></div>
 <${T} c=${["Name","Email","Role","Status","Actions"]} r=${(d.users||[]).map(u=>[u.name,u.email,u.role,u.active?h`<span class="tag">Active</span>`:h`<span class="tag r">Suspended</span>`,u.role=="admin"?"-":h`<span><button class="s" onClick=${()=>setEd(u)}>Permissions</button> <button class="s" onClick=${()=>up(u,{active:!u.active},u.active?"Staff suspended":"Staff activated")}>${u.active?"Suspend":"Activate"}</button> <button class="d2" onClick=${()=>auth.sendPasswordResetEmail(u.email).then(()=>alert("Reset email sent"))}>Reset password</button></span>`])}/></div>
 ${m&&h`<${Modal} t="Create staff" x=${()=>setM(false)}><form onSubmit=${e=>run(()=>mk(e))}>${I("name","Name",{required:1})}${I("email","Email (login)",{type:"email",required:1})}${I("password","Password (min 6)",{required:1,minLength:6})}<label>Role<select name="role"><option value="manager">Manager</option><option value="cashier">Cashier</option><option value="storekeeper">Storekeeper</option></select></label><button class="p">Create</button></form><//>`}
 ${ed&&h`<${Modal} t=${"Permissions – "+ed.name} x=${()=>setEd(null)}><form onSubmit=${e=>{e.preventDefault();const f=new FormData(e.target);up(ed,{role:f.get("role"),pages:Object.keys(PAGES).filter(k=>k!="staff"&&k!="logs"&&f.get(k))},"Permissions changed");setEd(null)}}>
 <label>Role<select name="role" defaultValue=${ed.role}>${["manager","cashier","storekeeper"].map(r=>h`<option>${r}</option>`)}</select></label>${Object.keys(PAGES).filter(k=>k!="staff"&&k!="logs").map(k=>h`<label style="display:flex;gap:8px"><input type="checkbox" name=${k} style="width:auto" defaultChecked=${(ed.pages||RP[ed.role]).includes(k)}/>${PAGES[k]}</label>`)}<small>Note: data-level limits come from the role in Firestore rules.</small><br/><button class="p">Save</button></form><//>`}`}

const Logs=({d})=>h`<div class="card"><${T} c=${["Time","Staff","Action","Detail"]} r=${[...(d.logs||[])].sort((a,b)=>b.ts-a.ts).slice(0,300).map(l=>[dt(l.ts),l.by,l.a,l.t])}/></div>`;

/* ---- App shell ---- */
function Auth({boot}){const [e,setE]=useState("");
 async function go(ev){ev.preventDefault();const f=frm(ev);setE("");try{
  if(boot){window.SETUP=1;const c=await auth.createUserWithEmailAndPassword(f.email,f.password);const b=db.batch();
   b.set(db.collection("users").doc(c.user.uid),{name:f.name,email:f.email,role:"admin",active:true,pinHash:await sha("1990"),ts:Date.now()});b.set(db.doc("config/boot"),{done:true,ts:Date.now()});await b.commit();window.SETUP=0;location.reload()}
  else await auth.signInWithEmailAndPassword(f.email,f.password)}catch(x){window.SETUP=0;setE(x.message)}}
 return h`<div class="login"><div class="card"><h2 style="margin-top:0;color:var(--g)">MEGA FARMS FOOD MARKET</h2><p>${boot?"First-time setup: create the Super Admin account (PIN 1990, change it later in Staff).":"Staff sign in"}</p>
 <form onSubmit=${go}>${boot&&I("name","Your name",{required:1})}${I("email","Email",{type:"email",required:1})}${I("password","Password",{type:"password",required:1,minLength:6})}<div class="err">${e}</div><button class="p" style="width:100%">${boot?"Create Super Admin":"Sign in"}</button></form></div></div>`}
function Pin({me,ok}){const [e,setE]=useState("");return h`<div class="login"><div class="card"><h3 style="margin-top:0">Super Admin PIN</h3><form onSubmit=${async ev=>{const f=frm(ev);if(await sha(f.pin)==me.pinHash)ok();else setE("Wrong PIN")}}>${I("pin","PIN",{type:"password",inputMode:"numeric",required:1,autoFocus:1})}<div class="err">${e}</div><button class="p">Unlock</button></form><br/><button class="s" onClick=${()=>auth.signOut()}>Sign out</button></div></div>`}
function App(){const [st,setSt]=useState("load"),[page,setPage]=useState("dash"),[rg,setRg]=useState({k:"day",a:"",b:""});const d=useData(st=="app");
 useEffect(()=>auth.onAuthStateChanged(async u=>{if(window.SETUP)return;if(!u){ME=null;let b=true;try{b=!(await db.doc("config/boot").get()).exists}catch(e){}return setSt(b?"setup":"login")}
  const s=await db.collection("users").doc(u.uid).get();if(!s.exists||!s.data().active){alert("Account not found or suspended.");return auth.signOut()}
  ME={id:u.uid,...s.data()};log("Login");setSt(ME.role=="admin"?"pin":"app")}),[]);
 if(st=="load")return h`<div class="login">Loading…</div>`;if(st=="setup"||st=="login")return h`<${Auth} boot=${st=="setup"}/>`;if(st=="pin")return h`<${Pin} me=${ME} ok=${()=>setSt("app")}/>`;
 const pages=ME.role=="admin"?RP.admin:(ME.pages||RP[ME.role]),pg=pages.includes(page)?page:pages[0],V={dash:Dash,pos:POS,products:Products,stock:Stock,purchases:Purchases,customers:Customers,suppliers:Suppliers,expenses:Expenses,reports:Reports,staff:Staff,logs:Logs}[pg];
 return h`<${React.Fragment}><header><div><b>MEGA FARMS FOOD MARKET</b><br/><small>${ME.name} · ${ME.role}</small></div><button class="s" onClick=${async()=>{await log("Logout");auth.signOut()}}>Sign out</button></header>
 <nav>${pages.map(k=>h`<button class=${k==pg?"on":""} onClick=${()=>setPage(k)}>${PAGES[k]}</button>`)}</nav><main>${(pg=="dash"||pg=="reports")&&h`<${RangeBar} rg=${rg} set=${setRg}/>`}<${V} d=${d} rg=${rg}/></main><//>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${EB}><${App}/><//>`);
</script>
</body>
</html>
