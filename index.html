 const pages=ME.role=="admin"?RP.admin:(ME.pages||RP[ME.role]),pg=pages.includes(page)?page:pages[0],V={dash:Dash,pos:POS,sales:Sales,products:Products,stock:Stock,purchases:Purchases,customers:Customers,credits:Credits,suppliers:Suppliers,expenses:Expenses,reports:Reports,returns:Returns,alerts:Alerts,settings:Settings,staff:Staff,logs:Logs}[pg];

 return h`<${React.Fragment}><div class="top"><button class="ham" onClick=${()=>setMenu(true)}>☰</button><b>${PAGES[pg]}</b><${Clock}/><button class="bell" onClick=${()=>go("alerts")}>🔔${nAl>0&&h`<i>${nAl}</i>`}</button><div class="av">${(ME.name||"?")[0].toUpperCase()}</div></div>
 ${menu&&h`<div class="ov" onClick=${()=>setMenu(false)}></div>`}<div class=${"side"+(menu?" on":"")}><div class="brand">${CFG.logo?h`<img src=${CFG.logo}/>`:Mark()}<b>${CFG.name}</b></div><div class="biz"><span>${CFG.address||"Main Branch"}</span><button onClick=${()=>confirm("Exit this business and sign out?")&&auth.signOut()}>← Exit</button></div>
 ${GR.map(([t,ks])=>{const v=ks.filter(k=>k=="@install"||pages.includes(k));return v.length?h`<div><h6>${t}</h6>${v.map(k=>k=="@install"?h`<button class="it ins" onClick=${inst}>📲 Install App</button>`:h`<button class=${"it"+(k==pg?" on":"")} onClick=${()=>go(k)}>${Ic(k)}${PAGES[k]}${k=="alerts"&&nAl>0&&h`<span class="bdg">${nAl}</span>`}</button>`)}</div>`:null})}
 <div class="sf"><div class="av">${(ME.name||"?")[0].toUpperCase()}</div><div><b>${ME.name}</b><small>${ME.role}</small></div><div class="btns"><button onClick=${()=>setDark(!dark)}>${dark?"☀️ Light":"🌙 Dark"}</button><button onClick=${async()=>{await log("Logout");auth.signOut()}}>⎋ Out</button></div></div></div>
 <main>${pg=="dash"&&h`<${RangeBar} rg=${rg} set=${setRg}/>`}<${V} d=${d} rg=${rg} go=${go}/></main>${pos&&h`<${POS} d=${d} x=${()=>setPos(false)}/>`}<//>`}
