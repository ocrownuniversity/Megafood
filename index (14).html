   if(cs&&cs.exists)tx.update(cr,{debt:Math.max(0,(cs.data().debt||0)-amount)});
   tx.set(db.collection("returns").doc(),{ref:sl.ref,li,pid:l.id,name:l.name,qty:q,amount,cost,method:f.method,reason:f.reason||"",by:ME.name,ts:Date.now()});
   tx.set(mvDoc(),{pid:l.id,name:l.name,type:"return",prev:p.qty,nw,chg:q,reason:"Return "+sl.ref,loss:false,lossValue:0,by:ME.name,ts:Date.now()})});
  log("Return",`${sl.ref} ${l.name} x${q} ${N(amount)}`);setM(false);setSid("")}
 return h`<${React.Fragment}><div class="row" style="align-items:center"><div><h2 style="margin:0">↩️ Returns</h2><small>Customer returns put stock back and refund the sale</small></div><button class="p" style="flex:0;white-space:nowrap" onClick=${()=>setM(true)}>+ Record Return</button></div>
 <div class="grid"><${K} i="↩️" c="x" l="Returns" v=${R.length}/><${K} i="💸" c="x" l="Refunded" v=${N(sum(R,r=>r.amount))}/></div>
 <div class="card" style="padding:0"><${T} c=${["#","Date","Sale ref","Product","Qty","Refund","Method","Reason","By"]} r=${R.map((r,i)=>[R.length-i,ds(r.ts),r.ref,h`<b>${r.name}</b>`,r.qty,h`<b style="color:var(--r)">${N(r.amount)}</b>`,h`<span class="tag">${(r.method=="credit"?"DEBT":r.method||"").toUpperCase()}</span>`,r.reason||"—",r.by])} e="No returns recorded"/></div>
 ${m&&h`<${Modal} t="Record return" x=${()=>{setM(false);setSid("")}}><form onSubmit=${e=>run(()=>sv(e))}><label>Sale<select value=${sid} onChange=${e=>setSid(e.target.value)} required><option value="">Choose a sale…</option>${sales.map(x=>h`<option value=${x.ref}>${x.ref} · ${x.cust||"Walk-in"} · ${N(x.total)}</option>`)}</select></label>
 ${sl&&h`<label>Item<select name="li">${sl.lines.map((l,i)=>h`<option value=${i}>${l.name} – sold ${l.qty}, returned ${got(sl.ref,i)}</option>`)}</select></label><div class="row">${I("qty","Quantity returned",{type:"number",step:"any",required:1})}<label>Refund as<select name="method"><option value="cash">Cash</option><option value="transfer">Transfer</option><option value="pos">Card</option>${sl.custId&&h`<option value="credit">Reduce customer debt</option>`}</select></label></div>${I("reason","Reason")}`}
 <div class="pf"><button type="button" class="s" onClick=${()=>{setM(false);setSid("")}}>Cancel</button><button class="p" disabled=${!sl}>Save return</button></div></form><//>`}<//>`}

/* ---- Staff ---- */
function Staff({d}){const [m,setM]=useState(false),[ed,setEd]=useState(null);
 async function mk(e){const f=frm(e);const a2=firebase.apps.find(x=>x.name=="s")||firebase.initializeApp(FB,"s");const cr=await a2.auth().createUserWithEmailAndPassword(f.email,f.password);await a2.auth().signOut();
  await db.collection("users").doc(cr.user.uid).set({name:f.name,email:f.email,role:f.role,active:true,ts:Date.now()});log("Staff created",`${f.name} (${f.role})`);setM(false)}
 const up=async(u,o,l)=>run(async()=>{await db.collection("users").doc(u.id).update(o);log(l,u.name)});
 const pin=async()=>{const p=prompt("New 4+ digit Super Admin PIN:");if(p&&p.length>=4){await db.collection("users").doc(ME.id).update({pinHash:await sha(p)});log("PIN changed")}};
 return h`<div class="card"><div class="row"><button class="p" onClick=${()=>setM(true)}>+ Create staff</button><button class="s" onClick=${pin}>Change my PIN</button></div>
 <${T} c=${["Name","Email","Role","Status","Actions"]} r=${(d.users||[]).map(u=>[u.name,u.email,u.role,u.active?h`<span class="tag">Active</span>`:h`<span class="tag r">Suspended</span>`,u.role=="admin"?"-":h`<span><button class="s" onClick=${()=>setEd(u)}>Permissions</button> <button class="s" onClick=${()=>up(u,{active:!u.active},u.active?"Staff suspended":"Staff activated")}>${u.active?"Suspend":"Activate"}</button> <button class="d2" onClick=${()=>auth.sendPasswordResetEmail(u.email).then(()=>alert("Reset email sent"))}>Reset password</button></span>`])}/></div>
 ${m&&h`<${Modal} t="Create staff" x=${()=>setM(false)}><form onSubmit=${e=>run(()=>mk(e))}>${I("name","Name",{required:1})}${I("email","Email (login)",{type:"email",required:1})}${I("password","Password (min 6)",{required:1,minLength:6})}<label>Role<select name="role"><option value="manager">Manager</option><option value="cashier">Cashier</option><option value="storekeeper">Storekeeper</option></select></label><button class="p">Create</button></form><//>`}
 ${ed&&h`<${Modal} t=${"Permissions – "+ed.name} x=${()=>setEd(null)}><form onSubmit=${e=>{e.preventDefault();const f=new FormData(e.target);up(ed,{role:f.get("role"),pages:Object.keys(PAGES).filter(k=>!["staff","logs","settings"].includes(k)&&f.get(k))},"Permissions changed");setEd(null)}}>
 <label>Role<select name="role" defaultValue=${ed.role}>${["manager","cashier","storekeeper"].map(r=>h`<option>${r}</option>`)}</select></label>${Object.keys(PAGES).filter(k=>!["staff","logs","settings"].includes(k)).map(k=>h`<label style="display:flex;gap:8px"><input type="checkbox" name=${k} style="width:auto" defaultChecked=${(ed.pages||RP[ed.role]).includes(k)}/>${PAGES[k]}</label>`)}<small>Note: data-level limits come from the role in Firestore rules.</small><br/><button class="p">Save</button></form><//>`}`}

const Logs=({d})=>h`<div class="card"><${T} c=${["Time","Staff","Action","Detail"]} r=${[...(d.logs||[])].sort((a,b)=>b.ts-a.ts).slice(0,300).map(l=>[dt(l.ts),l.by,l.a,l.t])}/></div>`;

/* ---- App shell ---- */
let DEFER=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFER=e});
const Mark=()=>h`<svg viewBox="0 0 130 130"><defs><linearGradient id="mkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="130" height="130" rx="30" fill="url(#mkg)"/><path d="M65 14C48 16 46 36 65 44 84 36 82 16 65 14Z" fill="#bbf7d0"/><path d="M42 70C42 46 88 46 88 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 70H98L90 102H40Z" fill="#fff"/><path d="M52 76V98M65 76V98M78 76V98" stroke="#2563eb" stroke-width="3"/></svg>`;
const Logo=()=>h`${CFG.logo?h`<img src=${CFG.logo} style="width:130px;height:130px;border-radius:50%;object-fit:cover"/>`:h`<svg viewBox="0 0 130 130" width="130" height="130"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><circle cx="65" cy="65" r="65" fill="url(#lgg)"/><path d="M65 18C48 20 46 40 65 48 84 40 82 20 65 18Z" fill="#bbf7d0"/><path d="M42 70C42 46 88 46 88 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 70H98L90 102H40Z" fill="#fff"/><path d="M52 76V98M65 76V98M78 76V98" stroke="#2563eb" stroke-width="3"/><text x="65" y="119" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">MEGA FARMS</text></svg>`}`;
const Pw=({n,l,ph})=>{const [v,setV]=useState(false);return h`<label>${l}<div style="position:relative"><input name=${n} type=${v?"text":"password"} placeholder=${ph} required minLength=${n=="password"?6:1} inputMode=${n=="pin"?"numeric":undefined}/><span style="position:absolute;right:14px;top:14px;cursor:pointer;font-size:20px" onClick=${()=>setV(!v)}>${v?"🙈":"👁"}</span></div></label>`};
const inst=()=>{if(DEFER){DEFER.prompt();DEFER=null}else alert("In your browser menu (⋮) choose 'Add to Home screen' or 'Install app'.")};
const Shell=({children})=>h`<div class="lg"><div class="lc"><${Logo}/>${children}<div class="ins"><div><b>Install Mega Farms App</b><small>Add to home screen for quick access</small></div><button type="button" onClick=${inst}>Install</button></div><div class="ft"><span class="dot"></span>Multi-device sync · <b>Super Admin</b></div></div></div>`;
function Auth({boot}){const [e,setE]=useState(""),[tab,setTab]=useState("staff"),[bz,setBz]=useState(false);
 async function go(ev){ev.preventDefault();const f=frm(ev);setE("");setBz(true);try{
  if(boot){window.SETUP=1;const c=await auth.createUserWithEmailAndPassword(f.email,f.password);const b=db.batch();
   b.set(db.collection("users").doc(c.user.uid),{name:f.name,email:f.email,role:"admin",active:true,pinHash:await sha("1990"),ts:Date.now()});b.set(db.doc("config/boot"),{done:true,ts:Date.now()});await b.commit();window.SETUP=0;location.reload()}
  else{window.PENDPIN=tab=="admin"?f.pin:null;await auth.signInWithEmailAndPassword(f.email,f.password)}}catch(x){window.SETUP=0;window.PENDPIN=null;setE(x.message)}setBz(false)}
 return h`<${Shell}>${!boot&&h`<div class="tabs"><button type="button" class=${tab=="staff"?"on":""} onClick=${()=>setTab("staff")}>Staff Login</button><button type="button" class=${tab=="admin"?"on":""} onClick=${()=>setTab("admin")}>Admin PIN</button></div>`}
 <div style="font-weight:800;color:#2563eb;margin-top:8px">${CFG.name}</div><h2>${boot?"First-time setup":"Welcome back"}</h2><p>${boot?"Create the Super Admin account (PIN 1990, change later)":tab=="admin"?"Super Admin: sign in with your PIN":"Sign in with your staff credentials"}</p>
 <form onSubmit=${go}>${boot&&I("name","Your name",{required:1})}${I("email","Email",{type:"email",required:1,placeholder:"staff@business.com"})}<${Pw} n="password" l="Password" ph="Password"/>${!boot&&tab=="admin"&&h`<${Pw} n="pin" l="Admin PIN" ph="PIN"/>`}
 <div class="err">${e}</div><button class="go" disabled=${bz}>${bz?"Please wait…":boot?"Create Super Admin":"Sign In →"}</button></form><//>`}
function Pin({me,ok}){const [e,setE]=useState("");return h`<${Shell}><h2>Admin PIN</h2><p>Enter your Super Admin PIN</p><form onSubmit=${async ev=>{const f=frm(ev);if(await sha(f.pin)==me.pinHash)ok();else setE("Wrong PIN")}}><${Pw} n="pin" l="PIN" ph="PIN"/><div class="err">${e}</div><button class="go">Unlock →</button></form><br/><button class="s" onClick=${()=>auth.signOut()}>Sign out</button><//>`}
const Clock=()=>{const [t,setT]=useState(Date.now());useEffect(()=>{const i=setInterval(()=>setT(Date.now()),1000);return()=>clearInterval(i)},[]);const n=new Date(t);return h`<span class="clk">${n.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})} · ${n.toLocaleTimeString("en-GB")}</span>`};
function App(){const [st,setSt]=useState("load"),[page,setPage]=useState("dash"),[rg,setRg]=useState({k:"day",a:"",b:""}),[menu,setMenu]=useState(false),[pos,setPos]=useState(false),[,setCf]=useState(0),[dark,setDark]=useState(()=>{try{return localStorage.getItem("mfd")=="1"}catch(e){return false}});
 useEffect(()=>{document.documentElement.setAttribute("data-theme",dark?"dark":"light");try{localStorage.setItem("mfd",dark?"1":"0")}catch(e){}},[dark]);const d=useData(st=="app");
 useEffect(()=>db.doc("config/biz").onSnapshot(x=>{CFG={...CFG,...(x.data()||{})};setCf(n=>n+1)},()=>{}),[]);
 useEffect(()=>auth.onAuthStateChanged(async u=>{if(window.SETUP)return;if(!u){ME=null;let b=true;try{b=!(await db.doc("config/boot").get()).exists}catch(e){}return setSt(b?"setup":"login")}
  const s=await db.collection("users").doc(u.uid).get();if(!s.exists||!s.data().active){alert("Account not found or suspended.");return auth.signOut()}
  ME={id:u.uid,...s.data()};log("Login");if(ME.role=="admin"){if(window.PENDPIN!=null){const ok=await sha(window.PENDPIN)==ME.pinHash;window.PENDPIN=null;if(!ok){alert("Wrong PIN");return auth.signOut()}return setSt("app")}return setSt("pin")}
  if(window.PENDPIN!=null){window.PENDPIN=null;alert("Admin PIN is for the Super Admin only.");return auth.signOut()}setSt("app")}),[]);
 if(st=="load")return h`<div style="padding:40px;text-align:center;color:#6b7490">Loading…</div>`;if(st=="setup"||st=="login")return h`<${Auth} boot=${st=="setup"}/>`;if(st=="pin")return h`<${Pin} me=${ME} ok=${()=>setSt("app")}/>`;
 const pages=ME.role=="admin"?RP.admin:(ME.pages||RP[ME.role]),pg=pages.includes(page)?page:pages[0],V={dash:Dash,pos:POS,sales:Sales,products:Products,stock:Stock,purchases:Purchases,customers:Customers,credits:Credits,suppliers:Suppliers,expenses:Expenses,reports:Reports,returns:Returns,alerts:Alerts,settings:Settings,staff:Staff,logs:Logs}[pg];
 const al=alertsOf(d),nAl=al.low.length+al.exp.length,go=k=>{setMenu(false);if(k=="pos")return setPos(true);setPage(k);window.scrollTo(0,0)};
 return h`<${React.Fragment}><div class="top"><button class="ham" onClick=${()=>setMenu(true)}>☰</button><b>${PAGES[pg]}</b><${Clock}/><button class="bell" onClick=${()=>go("alerts")}>🔔${nAl>0&&h`<i>${nAl}</i>`}</button><div class="av">${(ME.name||"?")[0].toUpperCase()}</div></div>
 ${menu&&h`<div class="ov" onClick=${()=>setMenu(false)}></div>`}<div class=${"side"+(menu?" on":"")}><div class="brand">${CFG.logo?h`<img src=${CFG.logo}/>`:Mark()}<b>${CFG.name}</b></div><div class="biz"><span>${CFG.address||"Main Branch"}</span><button onClick=${()=>confirm("Exit this business and sign out?")&&auth.signOut()}>← Exit</button></div>
 ${GR.map(([t,ks])=>{const v=ks.filter(k=>k=="@install"||pages.includes(k));return v.length?h`<div><h6>${t}</h6>${v.map(k=>k=="@install"?h`<button class="it ins" onClick=${inst}>📲 Install App</button>`:h`<button class=${"it"+(k==pg?" on":"")} onClick=${()=>go(k)}>${Ic(k)}${PAGES[k]}${k=="alerts"&&nAl>0&&h`<span class="bdg">${nAl}</span>`}</button>`)}</div>`:null})}
 <div class="sf"><div class="av">${(ME.name||"?")[0].toUpperCase()}</div><div><b>${ME.name}</b><small>${ME.role}</small></div><div class="btns"><button onClick=${()=>setDark(!dark)}>${dark?"☀️ Light":"🌙 Dark"}</button><button onClick=${async()=>{await log("Logout");auth.signOut()}}>⎋ Out</button></div></div></div>
 <main>${pg=="dash"&&h`<${RangeBar} rg=${rg} set=${setRg}/>`}<${V} d=${d} rg=${rg} go=${go}/></main>${pos&&h`<${POS} d=${d} x=${()=>setPos(false)}/>`}<//>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${EB}><${App}/><//>`);
</script>
</body>
